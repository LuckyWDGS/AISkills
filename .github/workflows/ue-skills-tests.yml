name: UE skills offline tests

on:
  push:
    paths:
      - 'skills/ue*/**'
      - 'tools/ue_docs_lint.py'
      - '.github/workflows/ue-skills-tests.yml'
  pull_request:
    paths:
      - 'skills/ue*/**'
      - 'tools/ue_docs_lint.py'
      - '.github/workflows/ue-skills-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
        # Each skills/ue<version>/ bundle holds the five UE skills as siblings.
        ue-version: ['5.8', '5.9']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UE_SKILLS: skills/ue${{ matrix.ue-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install skill requirements
        shell: bash
        run: |
          for skill in unreal-sequencer unreal-material-artist niagara-vfx-artist vfx-flipbook-generator; do
            python -m pip install -r "$UE_SKILLS/$skill/requirements.txt"
          done
      # Live-editor checks (live_smoke.py) need a running UE editor and stay local.
      - name: Run offline suites (loopback only)
        shell: bash
        run: python "$UE_SKILLS/unreal-engine-mcp/scripts/run_offline_tests.py"
      - name: Lint the bundle's Markdown against the documentation conventions
        shell: bash
        run: python tools/ue_docs_lint.py "$UE_SKILLS"

name: wechat-story-publisher offline tests

on:
  push:
    paths:
      - 'skills/wechat-story-publisher/**'
      - '.github/workflows/wechat-story-tools-tests.yml'
  pull_request:
    paths:
      - 'skills/wechat-story-publisher/**'
      - '.github/workflows/wechat-story-tools-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: skills/wechat-story-publisher
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r scripts/requirements.txt
      # Runners usually lack CJK fonts; the Chinese rendering test skips itself there.
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
